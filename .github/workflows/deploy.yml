name: Deploy my_site to VPS (vps-002)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, vps-002]
    steps:
      - name: Обновляем код в /srv/my_site
        run: |
          if [ ! -d /srv/my_site/.git ]; then
            git clone https://github.com/ts19830409/my_site.git /srv/my_site
          fi
          cd /srv/my_site
          git fetch origin main
          git reset --hard origin/main

      - name: Пишем .env
        working-directory: /srv/my_site
        run: |
          cat > .env << ENVEOF
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          DEBUG=False
          ALLOWED_HOSTS=ts-dev27.ru,www.ts-dev27.ru,localhost
          NAME=my_site_db
          DB_USER=postgres
          PASSWORD=${{ secrets.DB_PASSWORD }}
          HOST=db
          PORT=5432
          EMAIL_HOST=smtp.yandex.ru
          EMAIL_PORT=465
          EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}
          ENVEOF

      - name: Собираем и запускаем стек
        working-directory: /srv/my_site
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
          timeout 300 sh -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" my_site-web-1 2>/dev/null)" = "healthy" ]; do sleep 5; done'

      - name: Тесты, миграции, статика
        working-directory: /srv/my_site
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T web sh -c '\
            python manage.py test --noinput && \
            python manage.py migrate && \
            python manage.py collectstatic --noinput'

      - name: Медиа из релиза
        working-directory: /srv/my_site
        run: |
          if curl -fsSL -o /tmp/media-bundle.tar.gz https://github.com/ts19830409/my_site/releases/latest/download/media-bundle.tar.gz; then
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T web \
              sh -c 'find /app/media -mindepth 1 -maxdepth 1 -exec rm -rf {} + && tar -xzf - --strip-components=1 -C /app/media' < /tmp/media-bundle.tar.gz
          else
            echo "нет бандла медиа в релизах — пропускаю"
          fi

      - name: Smoke-тест
        run: |
          curl -fsS -o /dev/null -w 'HTTP %{http_code}\n' http://127.0.0.1/ || exit 1